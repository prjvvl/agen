name: cluster
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths: ["platform/**", "engine/**", "deploy/**", "web/**", ".github/workflows/cluster.yml"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: platform/go.mod
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          f=/etc/docker/daemon.json
          { [ -s $f ] && sudo cat $f || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee $f.new >/dev/null
          sudo mv $f.new $f && sudo systemctl restart docker
      - run: docker build -f deploy/docker/Dockerfile -t agen:dev .
      - run: go test -count=1 -v -timeout 30m -run TestDistributedCluster ./e2e/
        working-directory: platform
        env:
          AGEN_CLUSTER_E2E: "1"
  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: platform/go.mod
      - run: go install sigs.k8s.io/kind@v0.29.0
      - name: Pull Docker Hub images through mirror.gcr.io
        run: |
          f=/etc/docker/daemon.json
          { [ -s $f ] && sudo cat $f || echo '{}'; } | jq '. + {"registry-mirrors": ["https://mirror.gcr.io"]}' | sudo tee $f.new >/dev/null
          sudo mv $f.new $f && sudo systemctl restart docker
      - run: docker build -f deploy/docker/Dockerfile -t agen:dev .
      - run: go test -count=1 -v -timeout 30m -run TestKubernetesBackend ./e2e/
        working-directory: platform
        env:
          AGEN_KIND_E2E: "1"
