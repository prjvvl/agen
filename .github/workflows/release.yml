name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: platform/go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - id: build
        run: echo "archive=$(VERSION=${GITHUB_REF_NAME} ./scripts/release.sh | tail -1)" >> "$GITHUB_OUTPUT"
      - name: install / up / down / uninstall
        if: runner.os != 'Windows'
        run: ./scripts/test-install.sh "${{ steps.build.outputs.archive }}"
      - name: install / up / down / uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 "${{ steps.build.outputs.archive }}"
      - uses: actions/upload-artifact@v6
        with:
          name: agen-${{ matrix.os }}
          path: dist/*.*
