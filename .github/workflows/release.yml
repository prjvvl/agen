name: release
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["scripts/**", "platform/internal/cli/**", "platform/internal/templates/**", "examples/bundles/**", ".github/workflows/release.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: platform/go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - id: build
        run: |
          VERSION=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }} ./scripts/release.sh | tee "$RUNNER_TEMP/release.out"
          echo "archive=$(tail -1 "$RUNNER_TEMP/release.out")" >> "$GITHUB_OUTPUT"
      - name: install / up / down / uninstall
        if: runner.os != 'Windows'
        run: ./scripts/test-install.sh "${{ steps.build.outputs.archive }}"
      - name: install / up / down / uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-install.ps1 "${{ steps.build.outputs.archive }}"
      - uses: actions/upload-artifact@v6
        with:
          name: agen-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          # The release notes are this version's section of CHANGELOG.md.
          awk -v want="## $GITHUB_REF_NAME" '$0 == want {on = 1; next} /^## / {on = 0} on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $GITHUB_REF_NAME"; exit 1; }
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Agen $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
