syntax = "proto3";

package agen.v1;

import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/prjvvl/agen/platform/gen/agen/v1;agenv1";

message DeploymentRef {
  string namespace = 1;
  string name = 2;
}

// An immutable, content-addressed bundle version.
message Definition {
  string name = 1;
  // "sha256:<hex>" over all bundle files.
  string digest = 2;
  // Bundle-relative path -> file bytes.
  map<string, bytes> files = 3;
  google.protobuf.Timestamp created_at = 4;
}

enum DeploymentKind {
  DEPLOYMENT_KIND_UNSPECIFIED = 0;
  DEPLOYMENT_KIND_SINGLETON = 1;
  DEPLOYMENT_KIND_POOL = 2;
  DEPLOYMENT_KIND_TASK = 3;
}

message ScalePolicy {
  int32 min = 1;
  int32 max = 2;
  int32 target_queue_per_instance = 3;
  // Seconds without tasks or A2A traffic before scaling to min.
  int32 idle_timeout_seconds = 4;
  // Tasks one instance may run at once.
  int32 max_concurrency = 5;
}

message Budget {
  int64 max_tokens_per_run = 1;
  double max_usd_per_run = 2;
  double max_usd_per_day = 3;
}

// Fleet-side limits. In CreateDeployment and UpdateDeployment a field left
// 0 keeps the bundle's value (to turn a limit off, set it to 0 in the
// bundle's x-agen/config.json). maxRunDuration, maxIdenticalToolCalls,
// modelRequestTimeout and toolTimeout are set only in the bundle.
message Limits {
  // Max A2A/task delegation depth below a root run.
  int32 max_delegation_depth = 1;
  // Max delegated calls a single run may make.
  int32 max_fan_out = 2;
  // Max delegated calls across the whole tree under one root run.
  int32 max_total_delegations = 3;
  // Max queued tasks; more are refused (RESOURCE_EXHAUSTED).
  int32 max_queued_tasks = 4;
}

message Trigger {
  // "cron", "webhook" or "event".
  string type = 1;
  string name = 2;
  // Cron expression (cron triggers).
  string schedule = 3;
  // Task input to submit when fired (webhooks: prepended to the body).
  string input = 4;
  // Cron: after windows were missed (Hub down), fire the latest missed one
  // once. Missed windows are always recorded as "missed" events.
  bool catch_up = 5;
  // Set by the Hub when the trigger first appears on the deployment; cron
  // windows before it are never considered (a trigger added later does not
  // back-fill "missed" windows).
  int64 active_since_ms = 6;
  // Webhooks: how callers prove they hold the trigger's secret. Unset means
  // a bearer token.
  WebhookAuth auth = 7;
  // Webhooks: where to read the task's idempotency key (default: the
  // Idempotency-Key header). A repeated key returns the existing task.
  KeySource idempotency_key = 8;
  // Webhooks: where to read the task's conversation key, if anywhere.
  KeySource conversation_key = 9;
  // Labels set on every task this trigger submits.
  map<string, string> labels = 10;
  // Cron triggers, set by the Hub in responses: when the trigger fires
  // next and when it was last due (schedules are in UTC unless they start
  // with CRON_TZ=<zone>).
  google.protobuf.Timestamp next_due_at = 11;
  google.protobuf.Timestamp last_due_at = 12;
  // Event triggers: which events of the namespace's event log submit a task.
  EventMatch on = 13;
  // Event triggers: the task's conversation key, from the event:
  // {{event.taskId}}, {{event.parentTaskId}}, {{event.deployment}},
  // {{event.type}} or {{event.labels.<key>}}. Empty: a new conversation.
  string conversation = 14;
  // Cron: spread firing by a random amount in [0, jitter) after the
  // window is due (a Go duration, e.g. "30s"), so deployments sharing a
  // schedule don't all fire at once. Empty: no jitter.
  string jitter = 15;
  // Cron: bounds how late the latest missed window may still be caught
  // up (catch_up); beyond it, it is recorded missed instead. Empty: no
  // bound (always catches up the latest missed window).
  string catch_up_window = 16;
  // Cron: what happens when a window is due while an earlier firing's
  // task of this trigger is still queued, leased or running: "skip"
  // (don't fire while one is unfinished), "buffer_one" (fire at most one
  // more on top of one unfinished one), or "" / "allow" (fire regardless).
  string overlap = 17;
  // Cron: a fired window is at least this long (a Go duration) after the
  // previous firing's; a closer window is skipped (recorded, not
  // "missed"). Empty: no minimum.
  string min_start_spacing = 18;
  // Webhooks (3.7): the trust of tasks this trigger submits. Empty:
  // untrusted. Cron tasks are always trusted; this has no effect there.
  string trust = 19;
}

// Which events fire an event trigger.
message EventMatch {
  // Event types, or prefixes ending in "." (at least one).
  repeated string types = 1;
  // Only events of this deployment.
  string deployment = 2;
  // Only events whose labels include all of these.
  map<string, string> labels = 3;
  // Only events at least this severe: info, warning or critical.
  string severity = 4;
  // Fire once `count` matching events arrived within `within` (e.g. "10m"),
  // with all of them in one task. Unset: every matching event fires.
  int32 count = 5;
  string within = 6;
}

message WebhookAuth {
  // "bearer" (Authorization: Bearer <the trigger's webhook secret>) or
  // "hmac" (a signature of the raw body keyed with a platform secret).
  string type = 1;
  // hmac: the header carrying the signature, e.g. "X-Hub-Signature-256".
  string header = 2;
  // hmac: "sha256" (default) or "sha1".
  string algorithm = 3;
  // hmac: text before the hex signature, e.g. "sha256=".
  string prefix = 4;
  // hmac: the platform secret (SetSecret, same namespace) holding the
  // signing key shared with the sender.
  string secret = 5;
  // hmac: "hex" (default) or "base64" signature encoding.
  string encoding = 6;
}

// A value taken from a webhook request: a header, or a top-level field of a
// JSON body (dotted paths reach nested fields). Header wins when both are set
// and present.
message KeySource {
  string header = 1;
  string field = 2;
}

enum TriggerEventState {
  TRIGGER_EVENT_STATE_UNSPECIFIED = 0;
  // A task was queued.
  TRIGGER_EVENT_STATE_FIRED = 1;
  // The trigger was due but could not fire (for example the Hub was down).
  TRIGGER_EVENT_STATE_MISSED = 2;
  TRIGGER_EVENT_STATE_REJECTED = 3;
  // The window was due but intentionally not fired: an earlier firing's
  // task was still unfinished (overlap), or it was too soon after the
  // previous firing (min_start_spacing).
  TRIGGER_EVENT_STATE_SKIPPED = 4;
}

message TriggerEvent {
  string id = 1;
  string namespace = 2;
  string deployment = 3;
  string trigger = 4;
  TriggerEventState state = 5;
  string task_id = 6;
  google.protobuf.Timestamp due_at = 7;
  google.protobuf.Timestamp recorded_at = 8;
  string message = 9;
}

message Placement {
  // Nest must have all these labels.
  map<string, string> labels = 1;
}

message Deployment {
  string namespace = 1;
  string name = 2;
  string definition_digest = 3;
  DeploymentKind kind = 4;
  ScalePolicy scale = 5;
  Budget budget = 6;
  Placement placement = 7;
  // Desired instance count, set by operators or the autoscaler.
  int32 desired = 8;
  // Ready instance count across all Nests.
  int32 ready = 9;
  int64 generation = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  // Unix seconds of the last task or A2A activity.
  int64 last_activity_unix = 13;
  Limits limits = 14;
  repeated Trigger triggers = 15;
  // Paused: no instances run (autoscaler and wake-ups are ignored) and
  // queued tasks wait until the deployment is resumed.
  bool paused = 16;
  // Model spend of today's (UTC) runs, and whether it reached
  // budget.max_usd_per_day: then no new work starts (autoscaler holds 0,
  // no leases, wake-ups refused) until the next UTC day.
  double spent_usd_today = 17;
  bool budget_exhausted = 18;
  // Set while the deployment's provider account is held after an account
  // error (invalid key, no credit): it takes no new work until it recovers.
  ProviderHold provider_hold = 19;
}

// A provider account (provider + API key) held after an account error.
message ProviderHold {
  // "<provider>:<key secret name>[@<base url>]".
  string account = 1;
  string reason = 2;
  int32 failures = 3;
  google.protobuf.Timestamp held_at = 4;
  // When one probe task may go through; any run of the account that
  // succeeds after the hold began ends it.
  google.protobuf.Timestamp retry_at = 5;
  string probe_task_id = 6;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_STARTING = 1;
  INSTANCE_STATE_READY = 2;
  INSTANCE_STATE_BUSY = 3;
  INSTANCE_STATE_DRAINING = 4;
  INSTANCE_STATE_STOPPED = 5;
  INSTANCE_STATE_FAILED = 6;
}

message Instance {
  string id = 1;
  string namespace = 2;
  string deployment = 3;
  string nest_id = 4;
  string definition_digest = 5;
  InstanceState state = 6;
  // Direct endpoint inside the Nest (reached via the Gateway).
  string endpoint = 7;
  int32 running_tasks = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp last_seen = 10;
  string message = 11;
  // Tools the agent loaded (as the agent names them) and the state of each
  // tool server, as last reported by the instance.
  repeated string tools = 12;
  repeated ToolServer tool_servers = 13;
}

message ToolServer {
  string name = 1;
  // "connected" or "disconnected".
  string state = 2;
  int32 tool_count = 3;
}

enum NestState {
  NEST_STATE_UNSPECIFIED = 0;
  NEST_STATE_ACTIVE = 1;
  NEST_STATE_LOST = 2;
  NEST_STATE_DRAINING = 3;
  // Credentials revoked by an admin (agen nests revoke); it cannot reconnect.
  NEST_STATE_REVOKED = 4;
}

message Nest {
  string id = 1;
  string name = 2;
  string backend = 3;
  map<string, string> labels = 4;
  // Maximum instances this Nest accepts.
  int32 capacity = 5;
  int32 used = 6;
  string gateway_url = 7;
  NestState state = 8;
  google.protobuf.Timestamp last_heartbeat = 9;
}

// Desired placement: run `count` instances of a deployment in a nest.
message Assignment {
  string namespace = 1;
  string deployment = 2;
  string nest_id = 3;
  int32 count = 4;
  string definition_digest = 5;
  int64 generation = 6;
  // Deployment kind name ("singleton", "pool", "task") and per-instance
  // concurrency, so the Manager can start instances without another call.
  string kind = 7;
  int32 max_concurrency = 8;
  // Enforced by the receiving Gateway from the caller's agen.depth.
  int32 max_delegation_depth = 9;
}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_QUEUED = 1;
  TASK_STATE_LEASED = 2;
  TASK_STATE_RUNNING = 3;
  TASK_STATE_SUCCEEDED = 4;
  TASK_STATE_FAILED = 5;
  TASK_STATE_CANCELLED = 6;
  // Suspended (3.3, part): holds no instance or lease and is not
  // autoscaler load; wait_for says what it is waiting for. Not terminal.
  TASK_STATE_WAITING = 7;
}

message Task {
  string id = 1;
  string namespace = 2;
  string deployment = 3;
  string input = 4;
  TaskState state = 5;
  string output = 6;
  string error = 7;
  string instance_id = 8;
  string run_id = 9;
  // Where the task came from: "api", "cron:<name>", "webhook:<name>", "a2a".
  string source = 10;
  int32 attempts = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  google.protobuf.Timestamp lease_expires_at = 14;
  string trace_id = 15;
  // Fencing token of the current lease. Extend/Complete with any other value
  // are rejected, so a partitioned Nest cannot complete a re-leased task.
  string lease_id = 16;
  // Delegation lineage.
  string parent_task_id = 17;
  string parent_run_id = 18;
  string root_run_id = 19;
  int32 depth = 20;
  // W3C traceparent to continue.
  string traceparent = 21;
  // Tasks of a deployment with the same key continue one conversation.
  string conversation_key = 22;
  // Free-form labels, copied to the task's runs, its tool calls and the
  // tasks it delegates.
  map<string, string> labels = 23;
  // The approval the task's run waits for, while it waits.
  string pending_approval_id = 24;
  // Cost tier for a routing model (harness router): low, medium, high,
  // xhigh or max; capped by the bundle's router.maxTier. Empty: the default.
  string model_tier = 25;
  // Not leased before this time (a scheduled task).
  google.protobuf.Timestamp not_before = 26;
  // Set on a leased task when the deployment has spent most (80%) of its
  // daily budget: routing models then use the bundle's router.budgetTier.
  bool budget_pressure = 27;
  // Async delegation: when this task ends, its result is submitted as a task
  // to reply_deployment with reply_conversation_key.
  string reply_deployment = 28;
  string reply_conversation_key = 29;
  // How the task's run ended; unset until it ends.
  Outcome outcome = 30;
  // Why a queued task has not started (set in responses): not_before (its
  // start time is later), paused, budget (the daily budget is used up),
  // provider_held, conversation_busy (an older task of its conversation is
  // queued or running), caller_running (an async result waits for the run
  // that started the work), locks (one of its declared locks is held by
  // another task), asleep (an instance is being woken), capacity
  // (no Nest has room for an instance), starting (an instance is starting),
  // busy (every instance is busy). Empty: it is about to be taken.
  string wait_reason = 31;
  // What this task may do, narrower than its bundle: the task's own
  // overrides combined with every ancestor's. Unset: the bundle as is.
  TaskOverrides overrides = 32;
  // Not leased after this time: a still-queued task past it ends failed,
  // reason "expired", instead of waiting indefinitely.
  google.protobuf.Timestamp not_after = 33;
  // At most one queued task per (deployment, schedule_key); submitting a
  // task with the same key cancels the queued task that already has it.
  string schedule_key = 34;
  // Lease order within a deployment's queue: urgent, high, normal or
  // background (default normal). Does not cross deployments or affect
  // scheduling otherwise; a conversation's own ordering still applies first.
  string priority = 35;
  // operator, trusted or untrusted (3.7): set by the task's source (an API
  // token's trust, a webhook trigger's, or trusted for cron), or for a
  // child task, its caller's trust at the moment it started it (which may
  // already be lower than the caller's own task, through taint). A caller
  // may ask for a lower trust than its own; never higher.
  string trust = 36;
  // Declared locks (3.11, part): names this task must hold all of at once
  // before it is leased (the deployment's own `locks` config, plus any
  // named on submission), released when it ends.
  repeated string locks = 37;
  // What a TASK_STATE_WAITING task is waiting for (3.3, part): "<kind>:<ref>",
  // e.g. "child:<task id>". Unlike wait_reason (why a queued task has not
  // started), this is set only while suspended and cleared on resume.
  string wait_for = 38;
  // Temporal's parent-close policy (3.4, part): what happens to this task's
  // own unfinished children when it ends. "cancel" (default, also empty):
  // they are cancelled too, recursively down the tree. "abandon": left
  // running on their own, with no parent to report back to.
  string on_parent_end = 39;
  // The tree's root task (3.4, part): a task with no parent is its own
  // root; every descendant inherits its ancestor's. Unlike root_run_id
  // (which names a run and is empty until that run starts), this is always
  // set, so GetTaskTree can resolve a tree from any task in it right away.
  string root_task_id = 40;
  // The latest report_progress call (3.4, part); unset if the agent never
  // called it.
  TaskProgress progress = 41;
}

// A task's self-reported progress (3.4, part), from the built-in
// report_progress tool. Only the latest value is kept here; task.progress
// events are the history.
message TaskProgress {
  string step = 1;
  bool done = 2;
  int32 total = 3;
  string note = 4;
  repeated string artifacts = 5;
}

// Per-task settings that can only narrow what the bundle allows. A child
// task gets its own overrides combined with its parent's, so restrictions
// pass down a tree.
message TaskOverrides {
  // Only these of the bundle's tools (exact names or globs, as permission
  // rules write them). finish and load_skill are always there.
  repeated string tools = 1;
  // Skills (of the bundle) whose instructions are in the system prompt.
  repeated string skills = 2;
  // Text added after the system prompt.
  string system_addendum = 3;
  // Extra rules, deny or ask only, checked before the bundle's.
  repeated OverrideRule permissions = 4;
  // Run limits, at most the bundle's.
  RunBudget budget = 5;
}
message OverrideRule {
  string tool = 1;
  // "deny" or "ask".
  string action = 2;
}
// Limits for one run (0 or unset: the bundle's).
message RunBudget {
  int64 max_tokens = 1;
  double max_usd = 2;
  int32 max_turns = 3;
  // e.g. "20m".
  string max_duration = 4;
}

// One entry of the event log.
message Event {
  // Position in the log; increases in commit order.
  int64 seq = 1;
  string namespace = 2;
  // task.queued, task.started, task.finished, task.needs_input, task.stuck,
  // approval.pending, approval.decided, budget.threshold, provider.held,
  // provider.resumed, activity.warning, trigger.missed, webhook.rejected,
  // deployment.created, deployment.updated, deployment.deleted.
  string type = 3;
  string deployment = 4;
  string task_id = 5;
  string parent_task_id = 6;
  map<string, string> labels = 7;
  // info, warning or critical.
  string severity = 8;
  // Details per type (e.g. task.finished: state and outcome).
  google.protobuf.Struct data = 9;
  google.protobuf.Timestamp at = 10;
}

// How a run ended, beyond its state: what it reports and why it stopped.
message Outcome {
  // done, partial, needs_input, rejected, failed or cancelled.
  string status = 1;
  // Why a run stopped early: max_turns, budget, duration, stuck, cancelled,
  // interrupted, error or no_answer. Empty for a run that finished its work.
  string reason = 2;
  // The agent's report (its final answer when it did not call finish).
  string summary = 3;
  // Structured result from finish (checked against harness result.schema).
  google.protobuf.Value data = 4;
  repeated string artifacts = 5;
  // needs_input: who must answer, "caller" or "human".
  string input_from = 6;
}

enum ApprovalState {
  APPROVAL_STATE_UNSPECIFIED = 0;
  APPROVAL_STATE_PENDING = 1;
  APPROVAL_STATE_APPROVED = 2;
  APPROVAL_STATE_DENIED = 3;
  APPROVAL_STATE_EXPIRED = 4;
}

message Approval {
  string id = 1;
  string namespace = 2;
  string deployment = 3;
  string run_id = 4;
  string tool = 5;
  // Tool arguments with secret values redacted before persisting.
  google.protobuf.Struct arguments = 6;
  ApprovalState state = 7;
  // Principal whose request led to this approval; may not decide it.
  string requested_by = 8;
  string decided_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expires_at = 11;
  // The task whose run asked ("" for a run that is not a Hub task).
  string task_id = 12;
  google.protobuf.Timestamp decided_at = 13;
  // Readable names for requested_by / decided_by (token names).
  string requested_by_name = 14;
  string decided_by_name = 15;
}

message Usage {
  int64 input_tokens = 1;
  int64 output_tokens = 2;
  double cost_usd = 3;
}

message Span {
  string trace_id = 1;
  string span_id = 2;
  string parent_span_id = 3;
  string name = 4;
  string run_id = 5;
  google.protobuf.Timestamp start = 6;
  google.protobuf.Timestamp end = 7;
  // OTel-style attributes, e.g. gen_ai.request.model.
  google.protobuf.Struct attributes = 8;
  string status = 9;
}

message LogLine {
  string instance_id = 1;
  google.protobuf.Timestamp time = 2;
  string level = 3;
  string message = 4;
}

message ApiToken {
  string id = 1;
  string name = 2;
  // viewer, operator, approver, admin.
  repeated string scopes = 3;
  // Empty means all namespaces.
  repeated string namespaces = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  bool revoked = 7;
  // Acts for whoever submitted the task it works on (see CreateApiToken).
  bool on_behalf = 8;
  // The trust tasks submitted with this token get (3.7): operator, trusted
  // (default) or untrusted.
  string trust = 9;
}

// A judgement on how a task went: a person, a check, or a judge model.
message Feedback {
  string id = 1;
  string namespace = 2;
  string deployment = 3;
  string task_id = 4;
  // 0.0 (worst) to 1.0 (best).
  double score = 5;
  map<string, string> labels = 6;
  string note = 7;
  // Who gave it: a principal id, or "approval" for one recorded from an
  // approval decision.
  string by = 8;
  google.protobuf.Timestamp created_at = 9;
}

// Durable, named text an agent reads and updates across runs and
// conversations (`x-agen/config.json` `memory`), namespace-scoped (3.10).
message MemoryBlock {
  string namespace = 1;
  string id = 2;
  string label = 3;
  string description = 4;
  string value = 5;
  // 0: no limit.
  int64 limit_chars = 6;
  // Bumped on every update; the `memory_update` tool's `expectedVersion`
  // is checked against it, so parallel conversations cannot silently
  // overwrite each other.
  int64 version = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Named, content-addressed text an agent saved during a run with the
// save_artifact tool (3.8, part), read back with read_artifact or the API.
message Artifact {
  string namespace = 1;
  // "sha256:<hex>" of content.
  string id = 2;
  string name = 3;
  string media_type = 4;
  // Byte length of content.
  int64 size = 5;
  string content = 6;
  string task_id = 7;
  string run_id = 8;
  google.protobuf.Timestamp created_at = 9;
}

message Run {
  string id = 1;
  string session_id = 2;
  string conversation_id = 3;
  string namespace = 4;
  string deployment = 5;
  string status = 6;
  string input = 7;
  string output = 8;
  Usage usage = 9;
  string trace_id = 10;
  google.protobuf.Timestamp started_at = 11;
  google.protobuf.Timestamp ended_at = 12;
  string parent_run_id = 13;
  string root_run_id = 14;
  string definition_digest = 15;
  string task_id = 16;
  map<string, string> labels = 17;
  string error = 18;
  // Model turns taken.
  int64 steps = 19;
  // With ListRuns roots_only: usage and run count of the whole run tree
  // (this run and every run it delegated to).
  Usage tree_usage = 20;
  int32 tree_runs = 21;
  // How the run ended; unset while it runs.
  Outcome outcome = 22;
}
