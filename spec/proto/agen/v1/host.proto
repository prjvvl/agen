syntax = "proto3";

package agen.v1;

import "agen/v1/hub.proto";
import "agen/v1/resources.proto";

option go_package = "github.com/prjvvl/agen/platform/gen/agen/v1;agenv1";

// Manager -> agen-host control API. Implemented by the Rust host in the
// Connect JSON protocol (POST /agen.v1.HostService/<Method>), verified by a
// contract test against the Go client.
service HostService {
  rpc Health(HealthRequest) returns (HealthResponse);
  // Run one task to completion.
  rpc RunTask(RunTaskRequest) returns (RunTaskResponse);
  rpc CancelTask(HostCancelTaskRequest) returns (HostCancelTaskResponse);
  // Stop accepting work; finish running tasks.
  rpc Drain(DrainRequest) returns (DrainResponse);
}

// agen-host -> its Manager (localhost only). Everything a running agent needs
// from the platform goes through here, so hosts never talk to the Hub.
service ManagerService {
  // Raise an "ask" approval and wait for the decision.
  rpc RequestApproval(RequestApprovalRequest) returns (RequestApprovalResponse);
  // Resolve a secret with source "platform".
  rpc ResolveSecret(ResolveSecretRequest) returns (ResolveSecretResponse);
  // Resolve a deployment to A2A endpoints (sync delegation).
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Queue a task on another deployment for the calling instance's run
  // (async delegation); its result comes back as a task in the caller's
  // conversation.
  rpc StartTask(StartTaskRequest) returns (StartTaskResponse);
  // Waits for a task this instance started to finish, up to wait_seconds
  // (3.3: call_agent's unified delegation path starts a child task via
  // StartTask, then waits here before suspending instead of erroring).
  rpc WaitTask(WaitTaskRequest) returns (WaitTaskResponse);
  // Reports progress on the calling instance's own current task (3.4,
  // part: the report_progress built-in), not one it started.
  rpc ReportProgress(ReportProgressRequest) returns (ReportProgressResponse);
  // Progress, activity and outcome of one of the calling task's own
  // descendants (3.4, part: the query_agent built-in).
  rpc QueryChildTask(QueryChildTaskRequest) returns (QueryTaskResponse);
  // Signals one of the calling task's own descendants (3.4, part: the
  // signal_agent built-in). Written to the target's run_inbox; drained
  // into it before its next model call by DrainInbox.
  rpc SignalChildTask(SignalChildTaskRequest) returns (SignalChildTaskResponse);
  // Claims the calling task's own unconsumed run_inbox entries other than
  // "child" rows (3.4/3.9, part), so the engine can turn them into
  // messages before its next model call. Called once per turn when a
  // TaskStarter is configured; claiming is atomic, so a retried call never
  // redelivers an entry already claimed.
  rpc DrainInbox(DrainInboxRequest) returns (DrainInboxResponse);
  // Counts the calling task's own unfinished joined children (3.4, part:
  // "join"), checked by finish (refuses done while positive) and the
  // engine's turn loop (suspends instead of asking the model while
  // positive).
  rpc UnfinishedChildren(UnfinishedChildrenRequest) returns (UnfinishedChildrenResponse);
  // Whether the calling task is effectively held right now (3.4, part:
  // hold), checked by the engine's turn loop (suspends with wait_for
  // "resume" instead of asking the model while held).
  rpc IsHeld(IsHeldRequest) returns (IsHeldResponse);
}

message StartTaskRequest {
  DeploymentRef ref = 1;
  string input = 2;
  // The calling run; it must be a run of the calling instance.
  string run_id = 3;
  string traceparent = 4;
  // Where the result goes: the caller's conversation key.
  string reply_conversation_key = 5;
  // The same key returns the same task (a retried or resumed call).
  string idempotency_key = 6;
  // Narrow what the child may do (only for delegates with overrides on).
  TaskOverrides overrides = 7;
  // Cost tier for a routing model.
  string model_tier = 8;
  // The caller's trust right now (3.7); the child inherits it as is.
  string trust = 9;
}
message StartTaskResponse {
  Task task = 1;
}

message WaitTaskRequest {
  string task_id = 1;
  int32 wait_seconds = 2;
}
message WaitTaskResponse {
  Task task = 1;
}

message ReportProgressRequest {
  string task_id = 1;
  TaskProgress progress = 2;
}
message ReportProgressResponse {}

message QueryChildTaskRequest {
  string caller_task_id = 1;
  string task_id = 2;
}

message SignalChildTaskRequest {
  string caller_task_id = 1;
  string task_id = 2;
  string message = 3;
}
message SignalChildTaskResponse {}

message DrainInboxRequest {
  string task_id = 1;
}
message DrainInboxResponse {
  repeated InboxEntry entries = 1;
}

message UnfinishedChildrenRequest {
  string task_id = 1;
}
message UnfinishedChildrenResponse {
  int64 count = 1;
}

message IsHeldRequest {
  string task_id = 1;
}
message IsHeldResponse {
  bool held = 1;
}

message RequestApprovalRequest {
  string instance_id = 1;
  string run_id = 2;
  string tool = 3;
  // Already redacted by the engine.
  string arguments_json = 4;
  int32 ttl_seconds = 5;
}
message RequestApprovalResponse {
  Approval approval = 1;
}

message ResolveSecretRequest {
  string instance_id = 1;
  string name = 2;
}
message ResolveSecretResponse {
  string value = 1;
}

message HealthRequest {}
message HealthResponse {
  string instance_id = 1;
  bool ready = 2;
  int32 running_tasks = 3;
  bool draining = 4;
  repeated string tools = 5;
  repeated ToolServer tool_servers = 6;
}

message RunTaskRequest {
  Task task = 1;
  // W3C traceparent to continue.
  string traceparent = 2;
}
message RunTaskResponse {
  bool success = 1;
  string output = 2;
  string error = 3;
  Run run = 4;
}

message HostCancelTaskRequest {
  string task_id = 1;
}
message HostCancelTaskResponse {
  bool cancelled = 1;
}

message DrainRequest {}
message DrainResponse {}
