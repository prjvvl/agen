syntax = "proto3";

package agen.v1;

import "agen/v1/resources.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/prjvvl/agen/platform/gen/agen/v1;agenv1";

// Client-facing control plane API. Served by the Hub over Connect (gRPC,
// Connect, JSON) and exposed 1:1 as MCP tools. CLI and UI use only this.
service HubService {
  // Deploy a bundle (files in bundleFiles or bundleText) as a new deployment. With validateOnly, only check it and return warnings.
  rpc CreateDeployment(CreateDeploymentRequest) returns (CreateDeploymentResponse);
  // Roll out a new bundle version and/or change a deployment's scale, budget, limits, triggers or placement.
  rpc UpdateDeployment(UpdateDeploymentRequest) returns (UpdateDeploymentResponse);
  // A deployment and its instances (with the tools each loaded and their tool servers' state).
  rpc GetDeployment(GetDeploymentRequest) returns (GetDeploymentResponse);
  // Deployments in a namespace ("" = every namespace the token may see).
  rpc ListDeployments(ListDeploymentsRequest) returns (ListDeploymentsResponse);
  // Set the desired number of instances (within scale.min..max).
  rpc ScaleDeployment(ScaleDeploymentRequest) returns (ScaleDeploymentResponse);
  // Delete a deployment; its instances stop.
  rpc DeleteDeployment(DeleteDeploymentRequest) returns (DeleteDeploymentResponse);
  // Pause (stop all instances and hold at 0) or resume a deployment.
  rpc PauseDeployment(PauseDeploymentRequest) returns (PauseDeploymentResponse);

  // Every instance on every Nest, with state, running tasks and loaded tools.
  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse);
  // Enrolled Nests (machines or clusters that run instances).
  rpc ListNests(ListNestsRequest) returns (ListNestsResponse);

  // Queue a task (one agent run) for a deployment. Use conversationKey to continue an earlier conversation.
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  // A task and its result; waitSeconds (up to 300) waits for it to finish.
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  // Recent tasks, newest first.
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  // Cancel a task that has not finished; a running run is stopped.
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  // Every task in the tree a given task belongs to (its root's descendants,
  // including the root itself), oldest first (3.4, part).
  rpc GetTaskTree(GetTaskTreeRequest) returns (GetTaskTreeResponse);
  // A task's progress, current activity and outcome, without waiting on it
  // like GetTask's wait_seconds does (3.4, part).
  rpc QueryTask(QueryTaskRequest) returns (QueryTaskResponse);
  // Hold a task: a queued one is skipped by leasing, a running one suspends
  // at its next model call (3.4, part).
  rpc PauseTask(PauseTaskRequest) returns (PauseTaskResponse);
  // End a hold started by PauseTask, now or early.
  rpc ResumeTask(ResumeTaskRequest) returns (ResumeTaskResponse);

  // A2A endpoints of a deployment and a short-lived call token for them.
  rpc Resolve(ResolveRequest) returns (ResolveResponse);
  // Start a sleeping deployment (scale it to at least 1).
  rpc RequestWake(RequestWakeRequest) returns (RequestWakeResponse);

  // Approvals ("ask" permissions) that wait for a decision, or past ones.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse);
  // Approve or deny an approval. The principal whose work asked cannot decide it.
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse);

  // Bundle versions (definitions), without their files.
  rpc ListDefinitions(ListDefinitionsRequest) returns (ListDefinitionsResponse);
  // One bundle version with its files (text files also as textFiles).
  rpc GetDefinition(GetDefinitionRequest) returns (GetDefinitionResponse);

  // Trigger firings: fired, missed (Hub down) and rejected (bad credentials).
  rpc ListTriggerEvents(ListTriggerEventsRequest) returns (ListTriggerEventsResponse);
  // Create (or rotate) the secret a webhook trigger's callers must present.
  rpc CreateWebhookSecret(CreateWebhookSecretRequest) returns (CreateWebhookSecretResponse);
  // Set a platform secret (bundle secrets with source "platform"), for named deployments. Values never come back out.
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  // Platform secret names in a namespace (never values).
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  // Delete a platform secret.
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // Runs (one per task or A2A call), newest first, with usage and cost. Filter by status, labels and time; roots_only lists traces.
  rpc ListRuns(ListRunsRequest) returns (ListRunsResponse);
  // The spans of a trace: model calls, tool calls and delegations across agents.
  rpc GetTrace(GetTraceRequest) returns (GetTraceResponse);
  // A run's conversation: the messages it sent and received (tool calls and results included) and the system prompt.
  rpc GetTranscript(GetTranscriptRequest) returns (GetTranscriptResponse);
  // Runs, failures, duration percentiles, tokens and cost per deployment over a time window, who calls whom, and per served model.
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
  // What is happening now: every unfinished run with what it is doing (model, tool, waiting for an agent or an approval), queues, and warnings worth a look.
  rpc GetActivity(GetActivityRequest) returns (GetActivityResponse);
  // Operational log lines of a deployment: runs, instance and task lifecycle.
  rpc GetLogs(GetLogsRequest) returns (GetLogsResponse);
  // The event log, oldest first after a cursor: tasks queued, started and finished (with their outcome), approvals, budget thresholds, provider holds, warnings, missed triggers, deployment changes. wait_seconds waits for the next event.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);

  // Provider accounts held after an account error (invalid key, no credit): their deployments take no new work until one probe succeeds.
  rpc ListProviderHolds(ListProviderHoldsRequest) returns (ListProviderHoldsResponse);
  // End a provider hold now (e.g. after fixing the key or adding credit).
  rpc ResumeProvider(ResumeProviderRequest) returns (ResumeProviderResponse);

  // A single-use token for enrolling a Nest (agen nest run --join-token).
  rpc CreateJoinToken(CreateJoinTokenRequest) returns (CreateJoinTokenResponse);
  // Create an API token with scopes (viewer, operator, approver, admin), optionally limited to namespaces.
  rpc CreateApiToken(CreateApiTokenRequest) returns (CreateApiTokenResponse);
  // API tokens (never their secrets).
  rpc ListApiTokens(ListApiTokensRequest) returns (ListApiTokensResponse);
  // Revoke an API token.
  rpc RevokeApiToken(RevokeApiTokenRequest) returns (RevokeApiTokenResponse);
  // Revokes a Nest's credentials (bearer token and client certificate) and
  // reschedules its instances elsewhere.
  rpc RevokeNest(RevokeNestRequest) returns (RevokeNestResponse);
  // The caller's identity, scopes and namespaces.
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  // How bundles are laid out, the JSON Schema of every bundle file and a complete example bundle.
  rpc GetBundleGuide(GetBundleGuideRequest) returns (GetBundleGuideResponse);
  // Ready-made agent bundles to start from.
  rpc ListTemplates(ListTemplatesRequest) returns (ListTemplatesResponse);

  // Add or replace a namespace's notification target: a URL the Hub POSTs events to, signed with a secret it returns once.
  rpc SetNotificationTarget(SetNotificationTargetRequest) returns (SetNotificationTargetResponse);
  // Notification targets (never their secrets).
  rpc ListNotificationTargets(ListNotificationTargetsRequest) returns (ListNotificationTargetsResponse);
  // Remove a notification target.
  rpc DeleteNotificationTarget(DeleteNotificationTargetRequest) returns (DeleteNotificationTargetResponse);

  // Record a judgement on how a task went (a person, a check, or a judge model); approval decisions are recorded this way too.
  rpc RecordFeedback(RecordFeedbackRequest) returns (RecordFeedbackResponse);
  // Feedback, filtered by deployment, labels and time, newest first.
  rpc ListFeedback(ListFeedbackRequest) returns (ListFeedbackResponse);

  // Replace a memory block's value outright, creating it if it does not
  // exist yet (3.10). Agents change one through the memory_update tool
  // instead, which compares versions first.
  rpc SetMemoryBlock(SetMemoryBlockRequest) returns (SetMemoryBlockResponse);
  // A namespace's memory blocks, newest-updated first.
  rpc ListMemoryBlocks(ListMemoryBlocksRequest) returns (ListMemoryBlocksResponse);

  // One artifact by id (3.8, part): named, content-addressed text an
  // agent saved during a run with the save_artifact tool.
  rpc GetArtifact(GetArtifactRequest) returns (GetArtifactResponse);
  // A namespace's artifacts, newest first; optionally one task's.
  rpc ListArtifacts(ListArtifactsRequest) returns (ListArtifactsResponse);
}

message RecordFeedbackRequest {
  string task_id = 1;
  // 0.0 (worst) to 1.0 (best).
  double score = 2;
  map<string, string> labels = 3;
  string note = 4;
}
message RecordFeedbackResponse {
  Feedback feedback = 1;
}
message ListFeedbackRequest {
  string namespace = 1;
  string deployment = 2;
  map<string, string> labels = 3;
  // Only feedback recorded at or after this time.
  google.protobuf.Timestamp since = 4;
  int32 limit = 5;
}
message SetMemoryBlockRequest {
  string namespace = 1;
  string id = 2;
  string label = 3;
  string description = 4;
  string value = 5;
  // 0: no limit.
  int64 limit_chars = 6;
}
message SetMemoryBlockResponse {
  MemoryBlock block = 1;
}
message ListMemoryBlocksRequest {
  string namespace = 1;
}
message ListMemoryBlocksResponse {
  repeated MemoryBlock blocks = 1;
}

message GetArtifactRequest {
  string namespace = 1;
  string id = 2;
}
message GetArtifactResponse {
  Artifact artifact = 1;
}
message ListArtifactsRequest {
  string namespace = 1;
  string task_id = 2;
}
message ListArtifactsResponse {
  repeated Artifact artifacts = 1;
}

message ListFeedbackResponse {
  repeated Feedback feedback = 1;
}

message ListProviderHoldsRequest {}
message ListProviderHoldsResponse {
  repeated ProviderHold holds = 1;
}

message ResumeProviderRequest {
  string account = 1;
}
message ResumeProviderResponse {}

message ListTemplatesRequest {}
message Template {
  string name = 1;
  string title = 2;
  string description = 3;
  // e.g. "starter", "operations", "engineering".
  string category = 4;
  // Secrets the template needs (names from x-agen/secrets.json).
  repeated string secrets = 5;
  // Bundle files: path -> text.
  map<string, string> files = 6;
  // Tool servers the template connects to (mcp.json server names).
  repeated string tools = 7;
  // Skills the template ships (skills/<name>/SKILL.md).
  repeated string skills = 8;
}
message ListTemplatesResponse {
  repeated Template templates = 1;
}

message NotificationTarget {
  string namespace = 1;
  // Lowercase letters, digits and dashes; setting a name again replaces
  // the target and its signing secret.
  string name = 2;
  // http(s) URL that receives a signed JSON POST per event.
  string url = 3;
  // Event log types to send (or prefixes ending in "."), plus task.failed
  // (a task that failed) and budget.exhausted (a daily budget used up).
  // Empty: approval.pending, task.failed, budget.exhausted, provider.held
  // and provider.resumed.
  repeated string events = 4;
  google.protobuf.Timestamp created_at = 5;
  // Only events of this deployment.
  string deployment = 6;
  // Only events whose labels include all of these.
  map<string, string> labels = 7;
  // Only events at least this severe: info, warning or critical.
  string severity = 8;
  // Delivery state (read only): the last event seq handled, the last
  // delivery, since when deliveries fail and why, and events given up on
  // after failing for an hour.
  int64 delivered_seq = 9;
  google.protobuf.Timestamp last_delivered_at = 10;
  google.protobuf.Timestamp failing_since = 11;
  string last_error = 12;
  int64 dropped = 13;
}
message SetNotificationTargetRequest {
  NotificationTarget target = 1;
}
message SetNotificationTargetResponse {
  NotificationTarget target = 1;
  // Shown once. Each POST body is signed with it:
  // X-Agen-Signature: sha256=<hex HMAC-SHA256>.
  string secret = 2;
}
message ListNotificationTargetsRequest {
  string namespace = 1;
}
message ListNotificationTargetsResponse {
  repeated NotificationTarget targets = 1;
}
message DeleteNotificationTargetRequest {
  string namespace = 1;
  string name = 2;
}
message DeleteNotificationTargetResponse {}

message WhoAmIRequest {}
message WhoAmIResponse {
  // The principal id used in approvals ("admin" or "token:<id>").
  string id = 1;
  // The token's name ("" for the admin token).
  string name = 2;
  repeated string scopes = 3;
  // Empty means every namespace.
  repeated string namespaces = 4;
  // The trust tasks submitted with this token get (3.7).
  string trust = 5;
}

message GetBundleGuideRequest {}
message GetBundleGuideResponse {
  string guide = 1;
  // Bundle-relative path the schema applies to -> JSON Schema text.
  map<string, string> schemas = 2;
  // A complete example bundle: path -> file text.
  map<string, string> example = 3;
}

message CreateDeploymentRequest {
  string namespace = 1;
  // Defaults to the bundle name.
  string name = 2;
  // The bundle files. The Hub validates and stores them as a Definition.
  map<string, bytes> bundle_files = 3;
  // Bundle files as text (merged with bundle_files; easier to write by hand
  // or from an MCP client than base64).
  map<string, string> bundle_text = 11;
  // Check the bundle and settings and return warnings without deploying.
  bool validate_only = 10;
  // Overrides for values from x-agen/config.json; unset means use the bundle.
  DeploymentKind kind = 6;
  ScalePolicy scale = 4;
  Placement placement = 5;
  Budget budget = 7;
  Limits limits = 8;
  repeated Trigger triggers = 9;
  ConversationPolicy conversations = 12;
}
message CreateDeploymentResponse {
  // Unset when validate_only.
  Deployment deployment = 1;
  // Problems that do not stop the deployment but probably are mistakes,
  // e.g. an agent with no tools.
  repeated string warnings = 2;
}

message UpdateDeploymentRequest {
  DeploymentRef ref = 1;
  // New bundle version; empty keeps the current one.
  map<string, bytes> bundle_files = 2;
  ScalePolicy scale = 3;
  Budget budget = 4;
  Limits limits = 5;
  // Replaces the trigger set when non-empty.
  repeated Trigger triggers = 6;
  Placement placement = 7;
  map<string, string> bundle_text = 9;
  bool validate_only = 8;
  ConversationPolicy conversations = 10;
}
message UpdateDeploymentResponse {
  Deployment deployment = 1;
  repeated string warnings = 2;
}

message GetDeploymentRequest {
  DeploymentRef ref = 1;
}
message GetDeploymentResponse {
  Deployment deployment = 1;
  repeated Instance instances = 2;
}

message ListDeploymentsRequest {
  // Empty means all namespaces the caller may see.
  string namespace = 1;
}
message ListDeploymentsResponse {
  repeated Deployment deployments = 1;
}

message ScaleDeploymentRequest {
  DeploymentRef ref = 1;
  int32 desired = 2;
}
message ScaleDeploymentResponse {
  Deployment deployment = 1;
}

message DeleteDeploymentRequest {
  DeploymentRef ref = 1;
}
message DeleteDeploymentResponse {}

message PauseDeploymentRequest {
  DeploymentRef ref = 1;
  // false resumes.
  bool paused = 2;
}
message PauseDeploymentResponse {
  Deployment deployment = 1;
}

message ListInstancesRequest {
  string namespace = 1;
  string deployment = 2;
  string nest_id = 3;
}
message ListInstancesResponse {
  repeated Instance instances = 1;
}

message ListNestsRequest {}
message ListNestsResponse {
  repeated Nest nests = 1;
}

message SubmitTaskRequest {
  DeploymentRef ref = 1;
  string input = 2;
  // Optional client key; resubmitting the same key returns the same task.
  string idempotency_key = 3;
  // Tasks with the same key continue one conversation (and its memory).
  string conversation_key = 4;
  // Free-form labels, copied to runs, tool calls and delegated tasks.
  map<string, string> labels = 5;
  // Cost tier for a routing model; see Task.model_tier.
  string model_tier = 6;
  // Run no earlier than this (a scheduled task); unset: as soon as possible.
  google.protobuf.Timestamp not_before = 7;
  // Narrow what this task may do: tools, skills, a system prompt addendum,
  // extra deny/ask rules and run limits.
  TaskOverrides overrides = 8;
  // Not leased after this time: fails as "expired" instead of waiting
  // indefinitely for capacity.
  google.protobuf.Timestamp not_after = 9;
  // At most one queued task per (deployment, schedule_key); submitting
  // again with the same key cancels the queued task that already has it.
  string schedule_key = 10;
  // Lease order within this deployment's queue: urgent, high, normal or
  // background. Empty: normal.
  string priority = 11;
  // A trust at most this high (3.7): narrows the submitting principal's
  // own trust, never raises it. Empty: the principal's trust as is.
  string trust = 12;
  // Extra locks this task needs, on top of the deployment's own `locks`
  // config (3.11, part): it waits in the queue until it can take all of
  // them at once, then holds them until it ends.
  repeated string locks = 13;
  // Temporal's parent-close policy for this task's own children (3.4,
  // part): "cancel" (default, also empty) or "abandon". See Task.on_parent_end.
  string on_parent_end = 14;
}
message SubmitTaskResponse {
  Task task = 1;
}

message GetTaskRequest {
  string id = 1;
  // Wait up to this many seconds (at most 300) for the task to finish; the
  // task is returned as it is when the wait ends.
  int32 wait_seconds = 2;
}
message GetTaskResponse {
  Task task = 1;
}

message GetTaskTreeRequest {
  // Any task in the tree; the response covers its root and every one of
  // the root's descendants.
  string task_id = 1;
}
message GetTaskTreeResponse {
  repeated Task tasks = 1;
}

message QueryTaskRequest {
  string id = 1;
}
message QueryTaskResponse {
  string id = 1;
  TaskState state = 2;
  Outcome outcome = 3;
  TaskProgress progress = 4;
  // "model", "tool", "idle" or "approval"; unset if the task has no run
  // currently going (queued, or already terminal).
  string activity = 5;
  // The tool name, for "tool".
  string detail = 6;
  google.protobuf.Timestamp activity_since = 7;
  string pending_approval_id = 8;
}

message ListTasksRequest {
  string namespace = 1;
  string deployment = 2;
  TaskState state = 3;
  int32 limit = 4;
  // Only tasks waiting for their start time (not_before), soonest first.
  bool scheduled = 5;
}
message ListTasksResponse {
  repeated Task tasks = 1;
}

message CancelTaskRequest {
  string id = 1;
  // Cancel every unfinished task of id's whole tree (its root and every
  // descendant, found through root_task_id), not just id itself. Today
  // this is always a hard cancel (stopped at once); a graceful mode that
  // gives each run a last report turn first is not built yet.
  bool tree = 2;
}
message CancelTaskResponse {
  Task task = 1;
  // Set only when tree was asked for: every task it actually cancelled
  // (already-finished tasks of the tree are left out).
  repeated Task cancelled = 2;
}

message PauseTaskRequest {
  string id = 1;
  // Hold every unfinished task of id's whole tree (its root and every
  // descendant, found through root_task_id), not just id itself. Mirrors
  // CancelTask's tree, including async/detached children.
  bool tree = 2;
  // Unset: held until ResumeTask, with no deadline.
  google.protobuf.Timestamp until = 3;
  string reason = 4;
}
message PauseTaskResponse {
  Task task = 1;
  // Set only when tree was asked for: every task it actually held
  // (already-finished tasks of the tree are left out).
  repeated Task held = 2;
}

message ResumeTaskRequest {
  string id = 1;
  // End the hold on every task of id's whole tree, not just id itself.
  bool tree = 2;
}
message ResumeTaskResponse {
  Task task = 1;
  // Set only when tree was asked for: every task it actually resumed.
  repeated Task resumed = 2;
}

message ResolveRequest {
  DeploymentRef ref = 1;
  // NestService only: the deployment of the instance that will call (its
  // Manager asks on its behalf); the call token names it as the caller.
  DeploymentRef caller = 2;
}
message ResolveResponse {
  // A2A base URLs (Gateway routes) that can serve this deployment.
  repeated string endpoints = 1;
  int32 ready = 2;
  // A short-lived, Hub-signed call token for this deployment, sent to its
  // Gateways as a bearer token. Issued to operators (HubService) and to
  // agents of the caller deployment (NestService); empty otherwise.
  string token = 3;
  google.protobuf.Timestamp token_expires_at = 4;
}

message RequestWakeRequest {
  DeploymentRef ref = 1;
}
message RequestWakeResponse {
  Deployment deployment = 1;
}

message ListApprovalsRequest {
  string namespace = 1;
  ApprovalState state = 2;
}
message ListApprovalsResponse {
  repeated Approval approvals = 1;
}

message DecideApprovalRequest {
  string id = 1;
  bool approve = 2;
}
message DecideApprovalResponse {
  Approval approval = 1;
}

message ListRunsRequest {
  // Empty: every namespace the caller may see.
  string namespace = 1;
  string deployment = 2;
  // Runs per page (default 50, at most 500), newest first.
  int32 limit = 3;
  // running, waiting_approval, succeeded, failed or cancelled.
  string status = 4;
  // Only runs that started a trace (rootsOnly; not delegated runs), with
  // the usage of their whole run tree.
  bool roots_only = 5;
  // Runs carrying all of these labels.
  map<string, string> labels = 6;
  // Runs started at or after this time.
  google.protobuf.Timestamp since = 7;
  // nextPageToken of the previous page.
  string page_token = 8;
  // The run(s) of one task (a task's attempts resume one run).
  string task_id = 9;
}
message ListRunsResponse {
  repeated Run runs = 1;
  // Pass as pageToken for the next page; empty on the last page.
  string next_page_token = 2;
}

message GetTranscriptRequest {
  // A run id: a task's runId (get_task), or from list_runs or get_trace.
  string run_id = 1;
  // Also the earlier messages of the conversation the run continued.
  bool include_history = 2;
}
message ToolCallMessage {
  string id = 1;
  string name = 2;
  google.protobuf.Value arguments = 3;
}
message TranscriptMessage {
  // Position in the conversation (spans name it as agen.message.seq).
  int64 seq = 1;
  string run_id = 2;
  // user, assistant or tool.
  string role = 3;
  string content = 4;
  repeated ToolCallMessage tool_calls = 5;
  // For role tool: the call this is the result of.
  string tool_call_id = 6;
  google.protobuf.Timestamp created_at = 7;
}
message GetTranscriptResponse {
  Run run = 1;
  repeated TranscriptMessage messages = 2;
  // The agent's instructions (x-agen/agent.md body) of the run's bundle.
  string system_prompt = 3;
}

message GetMetricsRequest {
  // Empty: every namespace the caller may see.
  string namespace = 1;
  // Window length (default 86400, at most 30 days).
  int32 window_seconds = 2;
  // Number of time buckets per deployment (default 24, at most 200).
  int32 buckets = 3;
}
message MetricsBucket {
  int32 runs = 1;
  int32 failed = 2;
  double cost_usd = 3;
}
message DeploymentMetrics {
  DeploymentRef ref = 1;
  int32 runs = 2;
  int32 failed = 3;
  int32 cancelled = 4;
  // Runs not finished yet.
  int32 active = 5;
  int64 p50_ms = 6;
  int64 p95_ms = 7;
  Usage usage = 8;
  // Oldest first, each bucket_seconds long.
  repeated MetricsBucket buckets = 9;
}
message CallEdge {
  DeploymentRef from = 1;
  DeploymentRef to = 2;
  int32 calls = 3;
  int32 failed = 4;
  // Of calls: started with start_agent (async; the result comes back later).
  int32 async_calls = 5;
  // Of calls: still running.
  int32 active = 6;
  int64 p95_ms = 7;
}
// Model calls by the model that served them (a routing model or provider
// alias may serve another model than requested).
message ModelMetrics {
  string model = 1;
  string provider = 2;
  int32 calls = 3;
  int32 failed = 4;
  // Calls served by a fallback model.
  int32 fallbacks = 5;
  int64 p50_ms = 6;
  int64 p95_ms = 7;
  Usage usage = 8;
}
message GetMetricsResponse {
  repeated DeploymentMetrics deployments = 1;
  // Delegated calls between deployments in the window.
  repeated CallEdge edges = 2;
  google.protobuf.Timestamp since = 3;
  int32 bucket_seconds = 4;
  repeated ModelMetrics models = 5;
  // Where work came from that no agent of the fleet sent: the API or CLI,
  // schedules, webhooks, A2A callers outside the fleet; and results of async
  // work going back to the agent that started it (source "reply").
  repeated EntryEdge entries = 6;
}
message EntryEdge {
  // "api", "cron", "webhook", "a2a" (outside callers) or "reply".
  string source = 1;
  // For "reply": the agent the result came from.
  DeploymentRef from = 2;
  DeploymentRef to = 3;
  int32 runs = 4;
  int32 failed = 5;
}

message ListEventsRequest {
  // Empty: every namespace the caller may see.
  string namespace = 1;
  // Events after this seq (0: from the oldest kept).
  int64 after_seq = 2;
  // Only these types; a type ending in "." matches a prefix ("task.").
  repeated string types = 3;
  string deployment = 4;
  // Only events whose labels include all of these.
  map<string, string> labels = 5;
  // Only events at least this severe: info, warning or critical.
  string severity = 6;
  // At most this many events (default 100, at most 1000).
  int32 limit = 7;
  // Wait up to this long (at most 300) for a first matching event.
  int32 wait_seconds = 8;
}
message ListEventsResponse {
  repeated Event events = 1;
  // The cursor for the next call: the last seq looked at.
  int64 next_seq = 2;
}

message GetActivityRequest {
  // Empty: every namespace the caller may see.
  string namespace = 1;
}
// An unfinished run and what it is doing now.
message ActiveRun {
  string run_id = 1;
  DeploymentRef ref = 2;
  string task_id = 3;
  // The start of its input.
  string input = 4;
  google.protobuf.Timestamp started_at = 5;
  int64 turns = 6;
  // The agent's maxTurns.
  int32 max_turns = 7;
  Usage usage = 8;
  string trace_id = 9;
  string parent_run_id = 10;
  string root_run_id = 11;
  // "model" (waiting for the model), "tool", "agent" (waiting for another
  // agent), "approval" (waiting for a decision) or "idle" (between steps).
  string activity = 12;
  // The tool, or the agent waited for.
  string detail = 13;
  google.protobuf.Timestamp activity_since = 14;
  string approval_id = 15;
  string conversation_key = 16;
  // Where its task came from ("api", "cron:x", "reply:y"; empty over A2A).
  string source = 17;
  google.protobuf.Timestamp last_step_at = 18;
  // The deployment of the run that started this one (a call, or an async
  // start whose caller may have finished).
  DeploymentRef caller = 19;
}
message QueueStatus {
  DeploymentRef ref = 1;
  // Due and waiting for an instance.
  int32 queued = 2;
  // Waiting for their start time.
  int32 scheduled = 3;
  google.protobuf.Timestamp oldest_queued_at = 4;
}
message ActivityWarning {
  // near_turn_limit, near_run_budget, near_daily_budget, quiet_run,
  // waiting_approval, queue_waiting, burst, model_errors, provider_held.
  string kind = 1;
  // "warning" or "critical".
  string severity = 2;
  DeploymentRef ref = 3;
  string run_id = 4;
  string message = 5;
}
message GetActivityResponse {
  repeated ActiveRun runs = 1;
  repeated QueueStatus queues = 2;
  repeated ActivityWarning warnings = 3;
  google.protobuf.Timestamp now = 4;
}

message GetTraceRequest {
  string trace_id = 1;
}
message GetTraceResponse {
  repeated Span spans = 1;
  repeated Run runs = 2;
}

message ListDefinitionsRequest {
  string name = 1;
  // The versions this deployment has run, most recently used first (name is
  // then ignored).
  DeploymentRef ref = 2;
}
message ListDefinitionsResponse {
  // Files omitted; use GetDefinition.
  repeated Definition definitions = 1;
}

message GetDefinitionRequest {
  string digest = 1;
}
message GetDefinitionResponse {
  Definition definition = 1;
  // The text files of the definition (UTF-8), for clients that do not want
  // to decode base64.
  map<string, string> text_files = 2;
}

message SetSecretRequest {
  string namespace = 1;
  string name = 2;
  string value = 3;
  // The deployments (in this namespace) allowed to read it; at least one.
  repeated string deployments = 4;
}
message SetSecretResponse {}

message ListSecretsRequest {
  string namespace = 1;
}
message SecretInfo {
  string namespace = 1;
  string name = 2;
  google.protobuf.Timestamp updated_at = 3;
  repeated string deployments = 4;
}
message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}

message DeleteSecretRequest {
  string namespace = 1;
  string name = 2;
}
message DeleteSecretResponse {}

message CreateWebhookSecretRequest {
  DeploymentRef ref = 1;
  string trigger = 2;
}
message CreateWebhookSecretResponse {
  // Shown once; send as "Authorization: Bearer <secret>".
  string secret = 1;
  // Path on the Hub to POST to: /hooks/<ns>/<deployment>/<trigger>.
  string path = 2;
}

message ListTriggerEventsRequest {
  // Empty name: every deployment (of the namespace, or of every namespace
  // the caller may see when the namespace is empty too).
  DeploymentRef ref = 1;
  TriggerEventState state = 2;
  int32 limit = 3;
}
message ListTriggerEventsResponse {
  repeated TriggerEvent events = 1;
}

message GetLogsRequest {
  DeploymentRef ref = 1;
  string instance_id = 2;
  int32 limit = 3;
  // Only lines after this time.
  google.protobuf.Timestamp since = 4;
}
message GetLogsResponse {
  repeated LogLine lines = 1;
}

message CreateApiTokenRequest {
  string name = 1;
  repeated string scopes = 2;
  repeated string namespaces = 3;
  int32 ttl_seconds = 4;
  // For an agent that works for people (the assistant): each MCP call must
  // name the task it serves (_meta agen/taskId, which Agen sets), and runs
  // with the scopes and namespaces that both this token and the task's
  // submitter hold. It can never decide approvals.
  bool on_behalf = 5;
  // The trust tasks submitted with this token get (3.7): operator, trusted
  // (default) or untrusted.
  string trust = 6;
}
message CreateApiTokenResponse {
  ApiToken token = 1;
  // Shown once; only a hash is stored.
  string secret = 2;
}

message ListApiTokensRequest {}
message ListApiTokensResponse {
  repeated ApiToken tokens = 1;
}

message RevokeApiTokenRequest {
  string id = 1;
}
message RevokeApiTokenResponse {}

message RevokeNestRequest {
  string id = 1;
}
message RevokeNestResponse {}

message CreateJoinTokenRequest {
  int32 ttl_seconds = 1;
}
message CreateJoinTokenResponse {
  string token = 1;
  // "sha256:<hex>" of the Hub CA certificate, for a joining Nest to pin
  // (empty when the Hub serves plain HTTP).
  string ca_hash = 2;
}
