version: v2
modules:
  - path: .
lint:
  use: [STANDARD]
  # Hub, Nest and Host services deliberately share request/response messages
  # (e.g. Resolve, GetDefinition, SubmitChildTask) so the shapes cannot drift.
  except:
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use: [FILE]
