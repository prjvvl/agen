# kind cluster for the Kubernetes backend e2e: the Hub and a Nest Gateway
# are reachable from the host on 127.0.0.1.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - {containerPort: 30070, hostPort: 17444, listenAddress: "127.0.0.1"}
      - {containerPort: 30071, hostPort: 17445, listenAddress: "127.0.0.1"}
