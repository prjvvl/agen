# TCP (TLS passthrough) load balancing over the Hub replicas: mTLS terminates
# at the Hubs, so Nest client certificates reach them unchanged.
events {}
stream {
  resolver 127.0.0.11 valid=5s;
  upstream hubs {
    server hub1:7070 max_fails=1 fail_timeout=5s;
    server hub2:7070 max_fails=1 fail_timeout=5s;
  }
  server {
    listen 7443;
    proxy_pass hubs;
    proxy_connect_timeout 2s;
    proxy_next_upstream on;
  }
}
