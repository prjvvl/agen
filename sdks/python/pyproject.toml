[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "agen-sdk"
description = "Embed the Agen agent engine in Python"
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
classifiers = ["Programming Language :: Rust", "Programming Language :: Python :: 3"]
dynamic = ["version"]

[tool.maturin]
python-source = "python"
module-name = "agen._native"
features = ["pyo3/extension-module"]
